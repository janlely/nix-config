# TUN 配置（核心，全局透明代理）
tun:
  enable: true
  device: mihomo
  stack: gvisor
  skip-proxy-interfaces:
    - br0
    - tailscale0
  udp: false
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  exclude-interface:
    - br0
    - vnet0
    - tailscale0          # 新增：把 tailscale0 也排除
  # 新增：排除 Tailscale 网段，避免被接管路由
  route-exclude-address:
    - 100.64.0.0/10       # Tailscale CGNAT 整个段
#tun:
#  enable: true
#  device: mihomo
#  stack: gvisor   # system / mixed / gvisor，mixed 平衡性好
#  skip-proxy-interfaces:
#    - br0
#    - tailscale0
#  udp: false 
#  dns-hijack:
#    - any:53
#    - tcp://any:53
#  auto-route: true
#  auto-redirect: true
#  auto-detect-interface: true
#  strict-route: true         # 防路由泄漏，强烈推荐
#  exclude-interface:
#    - br0
#    - vnet0

# DNS 配置（防泄漏 + 分流）
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.xiaomi.com"
    - "localhost.ptlogin2.qq.com"  # 可按需添加本地域名
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query


geodata-mode: true
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

